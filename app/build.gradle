apply plugin: "com.android.application"

// ================================================================
// بيانات توقيع الـ release: من متغيرات بيئة (GitHub Actions Secrets وقت
// البناء بـ CI) أو من ملف keystore.properties محلي غير مرفوع لجيتهاب
// (استثناء بـ .gitignore) - لا يوجد أي كلمة مرور مكتوبة صراحة بالكود
// أو مرفوعة لجيتهاب بأي حال، بعكس ما كان معمولاً سابقاً بمفتاح debug.
def releaseStorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
if (releaseStorePassword == null) {
    def localProps = new Properties()
    def localFile = rootProject.file("keystore.properties")
    if (localFile.exists()) {
        localFile.withInputStream { localProps.load(it) }
        releaseStorePassword = localProps.getProperty("storePassword")
    }
}

android {
    namespace "com.tomodachi.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.tomodachi.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // ================================================================
            // إصلاح جذري لتحذير "فحص الحماية من جوجل يعتبر التطبيق خطراً":
            // ================================================================
            // السببان الحقيقيان الموثّقان رسمياً من جوجل واللي كانا موجودين هنا
            // فعلاً قبل هذا التعديل:
            //  1) android:debuggable="true" على نسخة الـ release - هذا تحديداً
            //     تحذير أمني معروف يصدره Play Protect/Play Console لأن أي تطبيق
            //     debuggable يسمح بحقن كود عبر ADB/JDWP وقت التشغيل، وهي تقنية
            //     شائعة الاستخدام بالبرمجيات الخبيثة لتجاوز الحماية أو إعادة
            //     تعبئة تطبيقات شرعية. الآن debuggable = false بالكامل بالـ release.
            //  2) توقيع نسخة الـ release بمفتاح debug العام (نفس المفتاح المشترك
            //     اللي تولّده أدوات أندرويد ستوديو تلقائياً لكل مطوّر بنفس القيم
            //     الافتراضية CN=Android Debug) - هذا نمط معروف تماماً لتطبيقات
            //     "مولّدة تلقائياً/مقلّدة" وترفع درجة الخطورة بفحص Play Protect
            //     الإحصائي. الآن يُستخدم مفتاح release حقيقي وفريد
            //     (tomodachi-release.keystore) بدل مفتاح debug المشترك.
            //
            // احتياط: لو ملف المفتاح الحقيقي مو موجود بعد (أول تشغيل CI قبل
            // إضافة الـ Secret)، نرجع مؤقتاً لمفتاح debug حتى لا يفشل البناء
            // بالكامل - لكن هذا احتياط انتقالي فقط، وليس الوضع الموصى به.
            def realKeystore = file("tomodachi-release.keystore")
            if (realKeystore.exists() && releaseStorePassword) {
                storeFile realKeystore
                storePassword releaseStorePassword
                keyAlias "tomodachi"
                keyPassword releaseStorePassword
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // resource shrinking off / lint off so CI never fails on non-critical warnings
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding false
    }
}

// ================================================================
// تنزيل مكتبات Firebase (وباقي مكتبات الطرف الثالث) محلياً وقت البناء
// ================================================================
// المشكلة الأصلية: index.html يحاول تحميل هذه الملفات من مسار محلي
// (assets/libs/firebase-app-compat.js ...) أولاً، لكن مجلد assets/libs
// لم يكن يحوي فعلياً سوى dompurify.min.js و xss.min.js - كل ملفات
// Firebase SDK (وdayjs وsweetalert2 وlodash وuuid) كانت مفقودة تماماً من
// الـ APK. النتيجة: كل تشغيل للتطبيق كان يعتمد إجبارياً على وصول الجهاز
// لـ gstatic.com/jsdelivr.net وقت الإقلاع (أبطأ، ويفشل تماماً بلا فايرستور
// لو الشبكة بطيئة/محجوبة/غير متوفرة لحظياً) رغم أن كل الكود مكتوب على
// افتراض أنها محلية دائماً. هذه المهمة تُنزّل الملفات الحقيقية من نفس
// روابط الـ CDN المستخدمة أصلاً بملف index.html وتضعها بمسارها المحلي
// الصحيح قبل تعبئة الـ APK، فيصير Firebase يعمل فوراً من داخل التطبيق
// نفسه بدون انتظار الشبكة، ويبقى التطبيق قادراً على العمل Offline-first
// كما يوحي كود enablePersistence بملف js/firebase.js.
// ملاحظة: لا تفشل البناء لو تعذّر الاتصال بالإنترنت وقت البناء (بيئة CI
// بدون شبكة مثلاً) - يبقى احتياط الرجوع لـ CDN وقت التشغيل بملف
// index.html يعمل كما هو، هذه فقط تحسين أداء/موثوقية إضافي.
def vendorLibsDir = file("src/main/assets/libs")
def vendorLibs = [
    "firebase-app-compat.js"      : "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js",
    "firebase-firestore-compat.js": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js",
    "firebase-storage-compat.js"  : "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js",
    "firebase-auth-compat.js"     : "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js",
    "dayjs/dayjs.min.js"                : "https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js",
    "dayjs/plugin/relativeTime.js"      : "https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/relativeTime.js",
    "dayjs/plugin/localizedFormat.js"   : "https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/localizedFormat.js",
    "sweetalert2.min.js": "https://cdn.jsdelivr.net/npm/sweetalert2@11",
    "lodash.min.js"      : "https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js",
    "uuid.min.js"        : "https://cdn.jsdelivr.net/npm/uuid@9.0.1/dist/umd/uuid.min.js"
]

tasks.register("downloadVendorLibs") {
    doLast {
        vendorLibs.each { relPath, url ->
            def outFile = new File(vendorLibsDir, relPath)
            if (outFile.exists() && outFile.length() > 0) {
                return // موجود بالفعل (مثلاً من تشغيل سابق) - لا داعي لإعادة التنزيل
            }
            outFile.parentFile.mkdirs()
            try {
                new URL(url).withInputStream { input ->
                    outFile.withOutputStream { output -> output << input }
                }
                println "✅ تم تنزيل ${relPath}"
            } catch (Exception e) {
                println "⚠️ تعذّر تنزيل ${relPath} من ${url} (${e.message}) - سيعتمد التطبيق على CDN وقت التشغيل بدلاً منه"
                if (outFile.exists() && outFile.length() == 0) {
                    outFile.delete()
                }
            }
        }
    }
}

preBuild.dependsOn("downloadVendorLibs")

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.activity:activity:1.9.2"
    implementation "androidx.core:core:1.13.1"
    // طبقة شاشة البدء الرسمية من Android (Splash Screen API) - انتقال سلس
    // ومتوافق مع أندرويد 12+ بدل شاشة بدء ثابتة بسيطة
    implementation "androidx.core:core-splashscreen:1.0.1"
}
