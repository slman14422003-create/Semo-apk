apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "com.google.gms.google-services"

// ================================================================
// بيانات توقيع الـ release: من متغيرات بيئة (GitHub Actions Secrets وقت
// البناء بـ CI) أو من ملف keystore.properties محلي غير مرفوع لجيتهاب
// (استثناء بـ .gitignore) - لا يوجد أي كلمة مرور مكتوبة صراحة بالكود
// أو مرفوعة لجيتهاب بأي حال.
// ⚠️ ملاحظة أمان: قيمة storePassword الموجودة حالياً بملف
// keystore.properties المحلي (المستثنى من git) كانت قد ظهرت نصاً صريحاً
// أثناء المراجعة - يُنصح بتغييرها (إعادة توليد keystore جديد بكلمة مرور
// جديدة) قبل أي رفع علني للمشروع، احتياطاً.
def releaseStorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
if (releaseStorePassword == null) {
    def localProps = new Properties()
    def localFile = rootProject.file("keystore.properties")
    if (localFile.exists()) {
        localFile.withInputStream { localProps.load(it) }
        releaseStorePassword = localProps.getProperty("storePassword")
    }
}

android {
    namespace "com.tomodachi.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.tomodachi.app"
        // firebase-auth-ktx 23.x يتطلب minSdk 23 على الأقل (كان 21 سابقاً
        // فيفشل دمج AndroidManifest.xml وقت البناء).
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        vectorDrawables { useSupportLibrary true }
    }

    def realKeystore = file("tomodachi-release.keystore")
    def hasRealReleaseKeystore = realKeystore.exists() && releaseStorePassword

    signingConfigs {
        release {
            if (hasRealReleaseKeystore) {
                storeFile realKeystore
                storePassword releaseStorePassword
                keyAlias "tomodachi"
                keyPassword releaseStorePassword
            }
            // لو ما فيه مفتاح release حقيقي بعد، buildTypes.release أدناه
            // يستخدم عندها signingConfigs.debug مباشرة (كائن AGP الحقيقي
            // المُوثَّق تلقائياً) بدل هذا الكائن.
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig hasRealReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // واجهة التطبيق بالكامل مكتوبة بـ Jetpack Compose - لا يوجد أي XML
    // Layout أو Fragment. buildFeatures.compose كانت مفقودة تماماً رغم أن
    // كل شاشة بالمشروع (LoginScreen، ChatScreen، AdminPanelScreen...) هي
    // @Composable - بدونها المشروع لا يُبنى إطلاقاً.
    buildFeatures {
        compose true
        viewBinding false
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // ------------------------------------------------------------
    // Kotlin / Core
    // ------------------------------------------------------------
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    // شاشة البدء الرسمية (Splash Screen API) - انتقال سلس ومتوافق مع
    // أندرويد 12+ بدل شاشة بدء ثابتة بسيطة.
    implementation "androidx.core:core-splashscreen:1.0.1"

    // ------------------------------------------------------------
    // Jetpack Compose - كانت هذه المجموعة كاملة مفقودة من المشروع رغم
    // أن كل شاشة/مكوّن بالكود (MainActivity, ChatScreen, MessageBubble,
    // EmojiStickerPicker...) يستورد androidx.compose.* مباشرة. بدونها
    // المشروع لا يُبنى نهائياً (آلاف أخطاء "unresolved reference").
    // ------------------------------------------------------------
    def composeBom = platform("androidx.compose:compose-bom:2024.12.01")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.material3:material3"
    // AdminPanelSettings و EmojiEmotions (مستخدمَين فعلياً بالكود) غير
    // موجودَين ضمن المجموعة الأساسية الصغيرة المرفقة تلقائياً مع
    // material3 - يلزم هذا الاعتماد المنفصل صراحةً لكل الأيقونات.
    implementation "androidx.compose.material:material-icons-extended"

    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    // ------------------------------------------------------------
    // Firebase (Auth + Firestore) - كانت مفقودة كذلك رغم أن ChatRepository
    // و ChatViewModel يعتمدان عليها مباشرة (FirebaseAuth، FirebaseFirestore).
    // ------------------------------------------------------------
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"

    // repo.xxx().await() على Task<T> يحتاج هذه المكتبة تحديداً.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
