apply plugin: "com.android.application"

// ================================================================
// بيانات توقيع الـ release: من متغيرات بيئة (GitHub Actions Secrets وقت
// البناء بـ CI) أو من ملف keystore.properties محلي غير مرفوع لجيتهاب
// (استثناء بـ .gitignore) - لا يوجد أي كلمة مرور مكتوبة صراحة بالكود
// أو مرفوعة لجيتهاب بأي حال، بعكس ما كان معمولاً سابقاً بمفتاح debug.
def releaseStorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
if (releaseStorePassword == null) {
    def localProps = new Properties()
    def localFile = rootProject.file("keystore.properties")
    if (localFile.exists()) {
        localFile.withInputStream { localProps.load(it) }
        releaseStorePassword = localProps.getProperty("storePassword")
    }
}

android {
    namespace "com.tomodachi.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.tomodachi.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // ================================================================
            // إصلاح جذري لتحذير "فحص الحماية من جوجل يعتبر التطبيق خطراً":
            // ================================================================
            // السببان الحقيقيان الموثّقان رسمياً من جوجل واللي كانا موجودين هنا
            // فعلاً قبل هذا التعديل:
            //  1) android:debuggable="true" على نسخة الـ release - هذا تحديداً
            //     تحذير أمني معروف يصدره Play Protect/Play Console لأن أي تطبيق
            //     debuggable يسمح بحقن كود عبر ADB/JDWP وقت التشغيل، وهي تقنية
            //     شائعة الاستخدام بالبرمجيات الخبيثة لتجاوز الحماية أو إعادة
            //     تعبئة تطبيقات شرعية. الآن debuggable = false بالكامل بالـ release.
            //  2) توقيع نسخة الـ release بمفتاح debug العام (نفس المفتاح المشترك
            //     اللي تولّده أدوات أندرويد ستوديو تلقائياً لكل مطوّر بنفس القيم
            //     الافتراضية CN=Android Debug) - هذا نمط معروف تماماً لتطبيقات
            //     "مولّدة تلقائياً/مقلّدة" وترفع درجة الخطورة بفحص Play Protect
            //     الإحصائي. الآن يُستخدم مفتاح release حقيقي وفريد
            //     (tomodachi-release.keystore) بدل مفتاح debug المشترك.
            //
            // احتياط: لو ملف المفتاح الحقيقي مو موجود بعد (أول تشغيل CI قبل
            // إضافة الـ Secret)، نرجع مؤقتاً لمفتاح debug حتى لا يفشل البناء
            // بالكامل - لكن هذا احتياط انتقالي فقط، وليس الوضع الموصى به.
            def realKeystore = file("tomodachi-release.keystore")
            if (realKeystore.exists() && releaseStorePassword) {
                storeFile realKeystore
                storePassword releaseStorePassword
                keyAlias "tomodachi"
                keyPassword releaseStorePassword
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // resource shrinking off / lint off so CI never fails on non-critical warnings
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.activity:activity:1.9.2"
    implementation "androidx.core:core:1.13.1"
    // طبقة شاشة البدء الرسمية من Android (Splash Screen API) - انتقال سلس
    // ومتوافق مع أندرويد 12+ بدل شاشة بدء ثابتة بسيطة
    implementation "androidx.core:core-splashscreen:1.0.1"
}
