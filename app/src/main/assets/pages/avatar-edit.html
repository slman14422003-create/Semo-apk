-e <!--
    ملاحظة: هذا الملف نسخة مطابقة (مصدر مرجعي) لنفس الـ HTML المستخدم فعليًا
    جوه index.html (السطور المقابلة). التطبيق حاليًا Single Page App وكل
    الشاشات محمّلة مسبقًا جوه index.html نفسه، فالسكريبتات (js/app.js,
    js/themes.js) بتشتغل على النسخة اللي جوه index.html مباشرة.
    لو حابب تحويل المشروع لتحميل الصفحات دي ديناميكيًا (fetch) بدل ما تكون
    كلها متضمنة في index.html من البداية، ده تغيير معماري أكبر ومحتاج
    تعديل ترتيب التحميل في js/app.js كمان - قولّي لو عايز أعمله كخطوة تانية.
-->

        <div class="modal-overlay" id="avatarModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>👤 تعديل الملف الشخصي</h3>
                    <button class="modal-close" id="closeAvatarModal">✕</button>
                </div>
                <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('fileInput').click()">
                    👥<div class="upload-overlay">📷 تغيير</div>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" />
                <button type="button" class="btn-random-avatar" id="randomAvatarBtn">🐾 أفاتار حيوان عشوائي</button>
                <div class="modal-field">
                    <label>👤 اسم المستخدم</label>
                    <input type="text" id="editNameInput" maxlength="20" />
                </div>
                <div class="modal-field">
                    <label>📝 نبذة عنك</label>
                    <textarea id="editBioInput" maxlength="150" placeholder="اكتب نبذة عنك..."></textarea>
                </div>
                <div class="modal-actions">
                    <button class="btn-save" id="saveAvatarBtn">💾 حفظ</button>
                    <button class="btn-cancel" id="cancelAvatarBtn">إلغاء</button>
                </div>
            </div>
        </div>
