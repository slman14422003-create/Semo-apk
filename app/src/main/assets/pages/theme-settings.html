-e <!--
    ملاحظة: هذا الملف نسخة مطابقة (مصدر مرجعي) لنفس الـ HTML المستخدم فعليًا
    جوه index.html (السطور المقابلة). التطبيق حاليًا Single Page App وكل
    الشاشات محمّلة مسبقًا جوه index.html نفسه، فالسكريبتات (js/app.js,
    js/themes.js) بتشتغل على النسخة اللي جوه index.html مباشرة.
    لو حابب تحويل المشروع لتحميل الصفحات دي ديناميكيًا (fetch) بدل ما تكون
    كلها متضمنة في index.html من البداية، ده تغيير معماري أكبر ومحتاج
    تعديل ترتيب التحميل في js/app.js كمان - قولّي لو عايز أعمله كخطوة تانية.
-->

        <div class="modal-overlay" id="themeModal">
            <div class="modal-content theme-modal">
                <div class="modal-header">
                    <h3>🎨 إعدادات الثيم</h3>
                    <button class="modal-close" id="closeThemeModal">✕</button>
                </div>
                
                <div class="theme-section">
                    <h4>🌓 الوضع</h4>
                    <div class="mode-options">
                        <button class="mode-option" data-mode="light">
                            <i class="fas fa-sun"></i>
                            <span>نهاري</span>
                        </button>
                        <button class="mode-option" data-mode="dark">
                            <i class="fas fa-moon"></i>
                            <span>ليلي</span>
                        </button>
                        <button class="mode-option" data-mode="auto">
                            <i class="fas fa-adjust"></i>
                            <span>تلقائي</span>
                        </button>
                    </div>
                </div>

                <div class="theme-section">
                    <h4>🎨 لون الفقاعات (المرسلة)</h4>
                    <div class="color-grid" id="sentColorOptions"></div>
                </div>

                <div class="theme-section">
                    <h4>🎨 لون الفقاعات (المستلمة)</h4>
                    <div class="color-grid" id="receivedColorOptions"></div>
                </div>

                <div class="theme-section">
                    <h4>🖼️ خلفية الدردشة</h4>
                    <div class="background-grid" id="backgroundOptions"></div>
                    <div class="background-upload">
                        <button onclick="document.getElementById('bgFileInput').click()" class="upload-bg-btn">
                            <i class="fas fa-upload"></i> رفع خلفية مخصصة
                        </button>
                        <input type="file" id="bgFileInput" accept="image/*" style="display:none;" />
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn-save" id="saveThemeBtn">💾 حفظ الإعدادات</button>
                    <button class="btn-cancel" id="resetThemeBtn">↩️ إعادة تعيين</button>
                </div>
            </div>
        </div>
