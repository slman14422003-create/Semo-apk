<!-- ==========================================================
     ADMIN PANEL - لوحة المسؤول
     ========================================================== -->
<div class="admin-header">
    <h2>🛡️ لوحة التحكم</h2>
    <button class="admin-close" id="closeAdminBtn">✕</button>
</div>
<div class="admin-connection">
    <span class="indicator online" id="statusIndicator"></span>
    <span id="statusText">🟢 متصل</span>
    <span class="admin-sync-time">آخر مزامنة: <span id="lastSyncTime">الآن</span></span>
</div>
<div class="admin-stats">
    <div class="admin-stat"><div class="stat-num" id="statUsers">0</div><div class="stat-label">المستخدمين</div></div>
    <div class="admin-stat"><div class="stat-num" id="statOnline">0</div><div class="stat-label">متصل</div></div>
    <div class="admin-stat"><div class="stat-num" id="statMessages">0</div><div class="stat-label">الرسائل</div></div>
    <div class="admin-stat"><div class="stat-num" id="statBlocked">0</div><div class="stat-label">محظورين</div></div>
</div>
<div class="admin-actions">
    <button class="admin-btn-restart" onclick="restartSync()">🔄 إعادة المزامنة</button>
    <button class="admin-btn-sync" onclick="forceSync()">📡 مزامنة فورية</button>
    <button class="admin-btn-repair" onclick="repairServer()">🔧 إصلاح</button>
    <button class="admin-btn-rebuild" onclick="rebuildDatabase()">🏗️ إعادة بناء</button>
    <button class="admin-btn-fix" onclick="fixIndexes()">🔍 إصلاح الفهارس</button>
    <button class="admin-btn-clear" onclick="clearAllMessages()">🗑️ مسح الكل</button>
</div>
<div class="admin-tabs">
    <button class="active" data-tab="users">👥 المستخدمين</button>
    <button data-tab="badwords">🚫 كلمات ممنوعة</button>
    <button data-tab="settings">⚙️ إعدادات</button>
    <button data-tab="stickers">🎨 ستيكرات</button>
</div>
<div class="admin-section active" id="tab-users"><div id="adminUserList"></div></div>
<div class="admin-section" id="tab-badwords">
    <div class="bad-words-input">
        <input type="text" id="badWordInput" placeholder="أدخل كلمة ممنوعة..." maxlength="30" />
        <button id="addBadWordBtn">➕ إضافة</button>
    </div>
    <div class="bad-words-list" id="badWordsList"></div>
</div>
<div class="admin-section" id="tab-settings">
    <div class="setting-item"><span class="setting-label">🔇 كتم جميع المستخدمين</span><div class="toggle-switch" id="muteAllSwitch"><span class="toggle-thumb"></span></div></div>
    <div class="setting-item"><span class="setting-label">🔒 تأكيد الحذف</span><div class="toggle-switch active" id="confirmDeleteSwitch"><span class="toggle-thumb"></span></div></div>
    <div class="setting-item"><span class="setting-label">🔊 الإشعارات الصوتية</span><div class="toggle-switch active" id="soundSwitch"><span class="toggle-thumb"></span></div></div>
</div>
<div class="admin-section" id="tab-stickers">
    <div class="sticker-admin-actions">
        <button onclick="document.getElementById('stickerFileInput').click()" class="sticker-admin-btn">📷 رفع</button>
        <button onclick="uploadStickerPack()" class="sticker-admin-btn">📦 حزمة</button>
        <button onclick="downloadStickerPack()" class="sticker-admin-btn">📥 تحميل</button>
        <button onclick="syncStickers()" class="sticker-admin-btn">🔄 مزامنة</button>
    </div>
    <div id="adminStickerList"></div>
</div>
