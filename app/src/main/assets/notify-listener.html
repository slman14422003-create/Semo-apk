<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Tomodachi - مراقب الخلفية</title>
</head>
<body>
<script>
// ================================================================
// صفحة خفيفة مخصّصة لخدمة MessageSyncService (راجع MessageSyncService.java)
// ================================================================
// لا تحمّل واجهة الدردشة الكاملة (index.html ثقيل: آلاف الأسطر، إيموجي،
// ستيكرات، لوحة مسؤول...) - فقط أقل عدد ملفات كافٍ للاتصال بفايرستور
// ومراقبة الرسائل الجديدة وقت ما يكون التطبيق الأساسي مغلقاً بالكامل.
// تشترك بنفس نطاق appassets.androidplatform.net، فتستفيد من نفس جلسة
// Firebase Auth المحفوظة (LOCAL persistence) اللي سجّلها المستخدم أصلاً
// من داخل التطبيق - بدون أي تسجيل دخول إضافي هنا.
window.__vendorLibs = [
    { local: 'libs/firebase-app-compat.js',       cdn: 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js' },
    { local: 'libs/firebase-firestore-compat.js', cdn: 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js' },
    { local: 'libs/firebase-auth-compat.js',      cdn: 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js' }
];
window.__scriptTimeoutMs = 4000;

function __loadOne(src, cb) {
    var done = false;
    var s = document.createElement('script');
    var timer = setTimeout(function () { if (!done) { done = true; cb(false); } }, window.__scriptTimeoutMs);
    s.src = src;
    s.onload = function () { if (!done) { done = true; clearTimeout(timer); cb(true); } };
    s.onerror = function () { if (!done) { done = true; clearTimeout(timer); cb(false); } };
    document.head.appendChild(s);
}

function __loadChain(list, onDone) {
    (function next(i) {
        if (i >= list.length) { onDone(); return; }
        var item = list[i];
        __loadOne(item.local, function (ok) {
            if (ok) { next(i + 1); return; }
            __loadOne(item.cdn, function () { next(i + 1); });
        });
    })(0);
}

function bail(reason) {
    console.warn('⚠️ background listener: ' + reason);
    if (window.AndroidBridge && window.AndroidBridge.onListenerIdle) {
        try { window.AndroidBridge.onListenerIdle(reason); } catch (e) {}
    }
}

__loadChain(window.__vendorLibs, function () {
    __loadOne('js/firebase.js', function (ok) {
        if (!ok || !window.__firebaseReady) { bail('firebase-not-ready'); return; }
        start();
    });
});

function getTimestampValue(ts) {
    if (!ts) return 0;
    if (typeof ts.toMillis === 'function') return ts.toMillis();
    if (ts.seconds) return ts.seconds * 1000;
    return 0;
}

function start() {
    var unsubscribeAuth = window.firebaseAuth.onAuthStateChanged(function (authUser) {
        unsubscribeAuth();
        var currentUser = localStorage.getItem('lastUser');
        if (!authUser || !currentUser) {
            bail('no-active-session');
            return;
        }

        var startedAt = Date.now();
        var firstSnapshot = true;

        db.collection('messages').orderBy('timestamp', 'desc').limit(5)
            .onSnapshot(function (snapshot) {
                // نتجاهل الدفعة الأولى (سجل قديم فايرستور يرجعه فوراً عند
                // بدء الاستماع) حتى لا نطلق إشعارات لرسائل شافها المستخدم
                // مسبقاً من داخل التطبيق نفسه.
                if (firstSnapshot) { firstSnapshot = false; return; }

                snapshot.docChanges().forEach(function (change) {
                    if (change.type !== 'added') return;
                    var data = change.doc.data();
                    if (!data || data.deleted) return;
                    if (!data.username || data.username === currentUser) return;
                    var msgTime = getTimestampValue(data.timestamp);
                    if (msgTime && msgTime < startedAt) return; // رسالة أقدم من بدء الخدمة

                    var title = '💬 ' + data.username;
                    var body = (data.text || '📩 رسالة جديدة').toString().slice(0, 120);
                    if (window.AndroidBridge && window.AndroidBridge.showMessageNotification) {
                        try { window.AndroidBridge.showMessageNotification(title, body); } catch (e) {}
                    }
                });
            }, function (err) {
                bail('snapshot-error: ' + (err && err.message));
            });
    });
}
</script>
</body>
</html>
