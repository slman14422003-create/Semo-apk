<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا يوجد اتصال - Tomodachi</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(145deg, #1877F2, #42B72A);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-align: center;
        padding: 24px;
    }
    .box { max-width: 360px; }
    .icon { font-size: 4rem; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; margin-bottom: 8px; }
    p { opacity: 0.9; font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; }
    button {
        background: #fff;
        color: #1877F2;
        border: none;
        padding: 10px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالشبكة حالياً. تحقق من اتصالك وحاول مرة أخرى.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
