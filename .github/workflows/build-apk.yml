name: Build Semo APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ================================================================
      # لا حاجة بعد الآن لخطوة "تنزيل مكتبات الطرف الثالث" الموجودة
      # بالنسخة القديمة (Firebase JS SDK, dayjs, sweetalert2...) لأن
      # التطبيق أصبح Kotlin أصلي بالكامل: Firebase Firestore/Auth تُجلَب
      # كمكتبات Gradle عادية من Maven مباشرة (راجع app/build.gradle)،
      # ولا يوجد أي WebView أو ملف HTML/JS يحمّلها وقت التشغيل إطلاقاً.
      # ================================================================

      # ================================================================
      # إعادة بناء مفتاح توقيع الـ release الحقيقي وقت التشغيل
      # ================================================================
      # ملف *.keystore الحقيقي مستثنى عمداً من جيت (.gitignore) لأسباب
      # أمنية. بدونه، سيوقّع Gradle كل إصدار "release" تلقائياً بمفتاح
      # debug عشوائي مختلف بكل تشغيل CI → أندرويد يعتبرها تطبيقات مختلفة
      # ويطلب إلغاء التثبيت القديم قبل أي تحديث. لذلك نعيد إنشاء نفس ملف
      # الـ keystore الحقيقي من GitHub Secret (RELEASE_KEYSTORE_BASE64)
      # بكل تشغيل، فيبقى نفس التوقيع ثابتاً بكل إصدار قادم.
      - name: Restore release keystore
        working-directory: app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > tomodachi-release.keystore
            echo "✅ تم استرجاع مفتاح التوقيع الحقيقي من GitHub Secret"
          else
            echo "⚠️ لا يوجد Secret باسم RELEASE_KEYSTORE_BASE64 - سيتم البناء بمفتاح debug (لن يُحدَّث تلقائياً بلا إلغاء تثبيت)"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Semo-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Semo-release.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Semo-APK
          path: out/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: 'Semo ${{ startsWith(github.ref, ''refs/tags/'') && github.ref_name || format(''build #{0}'', github.run_number) }}'
          files: out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
