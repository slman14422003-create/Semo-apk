name: CI/CD

# - Push على main: يبني نسخة debug فقط (وينشر Firebase Functions إذا تغيّرت ملفاتها).
# - دفع تاغ بصيغة v1.0.0: يبني نسخة release ويرفعها كـ GitHub Release.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch: {}

jobs:
  # =========================================================
  # 1) بناء نسخة تجريبية (debug) — يعمل فقط عند Push لفرع main
  # =========================================================
  build-debug:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: إنشاء google-services.json من Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "⚠️ لم يُضبط السر GOOGLE_SERVICES_JSON_BASE64 — يُنشأ ملف تجريبي مباشرةً للسماح بالبناء في CI فقط."
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "390244231579",
              "project_id": "semo-chat-f5fdf",
              "storage_bucket": "semo-chat-f5fdf.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:390244231579:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.tomodachi.chat" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEYFORCIBUILDONLY0000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: فحص Lint
        run: gradle lintDebug

      - name: بناء APK تجريبي (debug)
        run: gradle assembleDebug

  # =========================================================
  # 2) بناء نسخة الإصدار (release) ورفعها كـ GitHub Release
  #    يعمل فقط عند دفع تاغ بصيغة v1.0.0
  # =========================================================
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: إنشاء google-services.json من Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "❌ السر GOOGLE_SERVICES_JSON_BASE64 غير مضبوط. أضفه من Settings → Secrets → Actions قبل عمل Release."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: فك تشفير keystore التوقيع (اختياري)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: بناء APK للإصدار (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: تحديد اسم ملف APK الناتج
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: إنشاء GitHub Release ورفع APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Tomodachi ${{ github.ref_name }}"
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

  # =========================================================
  # 3) نشر Firebase Functions — يعمل فقط عند Push لفرع main
  #    مع تغيّر ملفات functions/ أو firestore.rules أو firebase.json
  # =========================================================
  deploy-functions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: تحديد الملفات المتغيّرة
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(functions/|firestore.rules|firebase.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: تثبيت Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تثبيت الاعتماديات
        if: steps.changes.outputs.run == 'true'
        working-directory: functions
        run: npm install

      - name: تثبيت Firebase CLI
        if: steps.changes.outputs.run == 'true'
        run: npm install -g firebase-tools

      - name: النشر إلى Firebase
        if: steps.changes.outputs.run == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions,firestore:rules --project semo-chat-f5fdf --token "$FIREBASE_TOKEN" --non-interactive
