name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: إنشاء google-services.json من Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "⚠️ لم يُضبط السر GOOGLE_SERVICES_JSON_BASE64 — يُستخدم ملف تجريبي فقط للسماح بالبناء في CI."
            cp app/google-services.json.template app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: منح صلاحية تنفيذ لـ gradlew
        run: chmod +x gradlew

      - name: فحص Lint
        run: ./gradlew lintDebug

      - name: بناء APK تجريبي (debug)
        run: ./gradlew assembleDebug

      - name: رفع APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomodachi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
