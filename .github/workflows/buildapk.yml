name: Build APK

# مرحلة واحدة متكاملة: بناء debug ثم مباشرة بناء release وتوقيعه ورفعه
# كـ GitHub Release تلقائي بتاغ يتولّد لوحده — كل هذا داخل نفس الـ job.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle (مع Cache تلقائي)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: التأكد من google-services.json
        # الملف موجود أصلًا داخل المستودع (app/google-services.json)، فلا حاجة لسر
        # إجباري لإعادة توليده. لو حاب تستبدله بقيمة من Secret خاصة ببيئة أخرى،
        # فعّل السر GOOGLE_SERVICES_JSON_BASE64 وسيُستخدم تلقائيًا بدل الملف المرفق.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "↻ استخدام google-services.json من الـ Secret"
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "✔ استخدام app/google-services.json الموجود في المستودع"
          fi

      - name: فحص Lint
        run: gradle lintDebug

      - name: بناء APK تجريبي (debug)
        run: gradle assembleDebug

      - name: تجهيز إعدادات التوقيع (release)
        # يُفضَّل استخدام keystore المرفق أصلًا (app/tomodachi-release.keystore).
        # لو أضفت السر KEYSTORE_BASE64 سيُستخدم بدلًا منه لتفادي وجود الملف في المستودع.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "↻ استخدام keystore من الـ Secret"
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          else
            echo "✔ استخدام app/tomodachi-release.keystore الموجود في المستودع"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/app/tomodachi-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: التحقق من أسرار التوقيع المطلوبة
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ الأسرار التالية غير مضبوطة: ${missing[*]}"
            echo "أضفها من: Settings → Secrets and variables → Actions → New repository secret"
            echo "(تأكد أنها Repository secrets وليست Environment secrets، وأن الاسم مطابق تمامًا بدون مسافات)"
            exit 1
          fi
          echo "✔ كل أسرار التوقيع موجودة"

      - name: بناء APK للإصدار (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: تحديد اسم ملفي APK الناتجين
        id: apk
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "release=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "debug=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: توليد رقم إصدار تلقائي
        id: version
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: إنشاء GitHub Release ورفع الملفين
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Tomodachi ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.release }}
            ${{ steps.apk.outputs.debug }}

  # =========================================================
  # نشر Firebase Functions تلقائيًا — فقط لو فيه تغيير فعلي
  # في ملفات functions/ أو firestore.rules أو firebase.json
  # =========================================================
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: تحديد الملفات المتغيّرة
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(functions/|firestore.rules|firebase.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: تثبيت Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تثبيت الاعتماديات
        if: steps.changes.outputs.run == 'true'
        working-directory: functions
        run: npm install

      - name: تثبيت Firebase CLI
        if: steps.changes.outputs.run == 'true'
        run: npm install -g firebase-tools

      - name: النشر إلى Firebase
        if: steps.changes.outputs.run == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions,firestore:rules --project semo-chat-f5fdf --token "$FIREBASE_TOKEN" --non-interactive
